// 16 Write a program to create a calculator for +,-,*, / & % using if statements. Take the following input: a. First number b. Second number c. Operation (+, -, *, /, %) Compute & show the calculated result to user. 
answer
var num1 = +prompt("Enter first number:");[cite: 24]
        var num2 = +prompt("Enter second number:");[cite: 24]
        var op = prompt("Enter operation (+, -, *, /, %):");[cite: 24]

        var result;

        if (op === "+") {
            result = num1 + num2;
            alert("Result: " + num1 + " + " + num2 + " = " + result);
        } else if (op === "-") {
            result = num1 - num2;
            alert("Result: " + num1 + " - " + num2 + " = " + result);
        } else if (op === "*") {
            result = num1 * num2;
            alert("Result: " + num1 + " * " + num2 + " = " + result);
        } else if (op === "/") {
            if (num2 !== 0) {
                result = num1 / num2;
                alert("Result: " + num1 + " / " + num2 + " = " + result);
            } else {
                alert("Error! Division by zero is not allowed.");
            }
        } else if (op === "%") {
            if (num2 !== 0) {
                result = num1 % num2;
                alert("Result: " + num1 + " % " + num2 + " = " + result);
            } else {
                alert("Error! Modulus by zero is not allowed.");
            }
        } else {
            alert("Invalid operation entered!");
        }

var langCode = prompt("Enter language code (e.g., 'es', 'de', 'fr', 'en'):");

        if (langCode === "es") {
            alert("Hola, Mundo");
        } else if (langCode === "de") {
            alert("Hallo, Welt");
        } else if (langCode === "fr") {
            alert("Bonjour, le monde");
        } else {
            alert("Hello, World"); // Defaults to English
        }
// 21 Write a program to take input a number & tell whether it’s a positive or negative number. 
answer
var number = +prompt("Please enter a number:");

        if (number > 0) {
            alert("The number " + number + " is positive.");
        } else if (number < 0) {
            alert("The number " + number + " is negative.");
        } else {
            alert("The number is zero.");
        }
// 22 The Pluralizer: Write a program that: a. takes 2 inputs, a noun and a number. b. tells the number and pluralized form, like "5 cats" or "1 dog". 
answer
var noun = prompt("Please enter a noun (e.g., cat, dog, boat):");
        var number = +prompt("Please enter a number:");

        if (number === 1) {
            alert(number + " " + noun);
        } else {
            alert(number + " " + noun + "s");
        }
